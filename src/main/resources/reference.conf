akka {
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  loglevel = "INFO"
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"
  logger-startup-timeout = 30s

  actor {
    debug {
      # enable function of LoggingReceive, which is to log any received message at DEBUG level
      #receive = on
      # enable DEBUG logging of all AutoReceiveMessages (Kill, PoisonPill and the like)
      #autoreceive = on
      # enable DEBUG logging of actor lifecycle changes
      #lifecycle = on
    }
  }

  http {
    host-connection-pool {
      max-connections = 64
      max-open-requests = 2048
      pipelining-limit = 4
      max-retries = 2
      base-connection-backoff = 1s
      idle-timeout = 10min
    }

    client {
      idle-timeout = 10min
    }

    server {
      listen_ip : "0.0.0.0"
      listen_port: 8080

      request_log: true
      request_log: ${?REQUEST_LOG}
    }
  }
}

metrics {
  jvm = true
  # These are the metrics reporters
  reporters {
    Slf4j {
      # The name of the reporter class
      class = "com.featurefm.riversong.metrics.reporting.Slf4jReporter"
      # Is the reporter enabled
      enabled = off
      # What is the interval to report on
      reporting-interval = 10m
      # What is the logger
      logger = "com.featurefm.riversong.metrics"
    }
  }
}

health-check {
  use-in-status = false
  interval-seconds = 30
}

services {

  max-failures: 3
  call-timeout-ms: 2000
  reset-timeout-seconds: 5
  health-check-interval-seconds: 30

}

kafka {
  is-critical: true

  # Defaults for KafkaConsumerStallCheck (opt-in; a service must create & register the check).
  # See com.featurefm.riversong.kafka.KafkaConsumerStallCheck.
  consumer {
    stall-detector {
      # How often to sample committed vs log-end offsets via AdminClient. Kept low-frequency on
      # purpose: the AdminClient offset RPCs are cheap but this guards a slow failure mode (a
      # wedged partition matters over hours/days, not seconds), so there is no need to poll the
      # broker hard. Detection latency is bounded by this interval — a stall is caught within
      # ~1–2 poll intervals. Lower it per-service if you need faster detection.
      check-interval: 60 minutes
      # A partition must have a backlog AND a non-advancing committed offset for at least this
      # long before it is flagged CRITICAL. Well above a normal backlog drain (offsets keep
      # advancing during a drain) and broker/rebalance hiccups. Note: effective detection can
      # never be faster than check-interval, so a stall-timeout below it just means "flag on the
      # first poll that shows no progress".
      stall-timeout: 10 minutes
      # Ignore partitions whose lag is below this (idle / caught-up partitions).
      # lag = log-end − committed = the count of messages produced but not yet consumed (in message/offset units, not time)
      min-lag: 100
      # Timeout for each AdminClient offset request.
      admin-timeout: 15 seconds
      # If no partition assignment (rebalance callback) is observed within this long after
      # start(), warn — the rebalance listener was probably never attached to the consumer.
      assignment-warn-after: 60 seconds
    }
  }
}